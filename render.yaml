services:
  - type: web
    name: nlp-classifier-api
    runtime: python
    buildCommand: "pip install -r requirements.txt && python -c \"import nltk; nltk.download('stopwords')\""
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0